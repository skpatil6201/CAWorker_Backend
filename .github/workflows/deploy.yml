name: Deploy Node App

on:
push:
branches:
- main

jobs:
deploy:
runs-on: ubuntu-latest

```
steps:
  - name: Checkout
    uses: actions/checkout@v4

  - name: Deploy to EC2
    uses: appleboy/ssh-action@v1.0.3
    with:
      host: ${{ secrets.EC2_HOST }}
      username: ${{ secrets.EC2_USER }}
      key: ${{ secrets.EC2_SSH_KEY }}
      script: |
        cd /home/ec2-user/CAWorker_Backend

        git fetch origin
        git reset --hard origin/main
        git clean -fd

        npm install
        npm run build

        pm2 restart caworker-backend || pm2 start dist/index.js --name caworker-backend

        pm2 save
```
